<script>
const masks=[63,6,91,79,102,109,125,7,127,111];
const bars=[[16,0,69,16],[85,16,16,48],[85,80,16,48],[16,128,69,16],[0,80,16,48],[0,16,16,48],[16,64,69,16]];
const digits=[...document.querySelectorAll('.digit')];
const progress=document.querySelector('#progress');
const sound=document.querySelector('#sound');
const play=document.querySelector('#play');
let audio, enabled=true, timer;
function draw(seconds, total) {
  const clock=String(Math.floor(seconds/60)).padStart(2,'0')+String(seconds%60).padStart(2,'0');
  digits.forEach((digit,i)=>{
    digit.innerHTML=bars.map(([x,y,w,h],j)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+((masks[clock[i]] & 1<<j)?'#55dfff':'#162944')+'"/>').join('');
  });
  progress.setAttribute('width',507*seconds/total);
}
function tick(){
  if (!enabled || !audio || audio.state!=='running') return;
  const tone=audio.createOscillator(), gain=audio.createGain(), t=audio.currentTime;
  tone.frequency.value=1100;
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(.027,t+.001);
  gain.gain.exponentialRampToValueAtTime(.0001,t+.022);
  tone.connect(gain).connect(audio.destination);
  tone.start(t);tone.stop(t+.023);
}
function activateAudio(){
  const Audio=window.AudioContext || window.webkitAudioContext;
  if(Audio && !audio) audio=new Audio();
  if(audio) audio.resume().catch(()=>{});
}
sound.onclick=()=>{
  enabled=!enabled;
  sound.textContent=enabled?'Тиканье · вкл.':'Тиканье · выкл.';
  sound.setAttribute('aria-pressed',enabled);
  if(enabled) activateAudio();
};
play.onclick=()=>{
  if(enabled) activateAudio();
  clearInterval(timer);
  let last=20;
  const deadline=performance.now()+20000;
  play.textContent='Начать заново';
  draw(last,20);
  timer=setInterval(()=>{
    const seconds=Math.max(0,Math.ceil((deadline-performance.now())/1000));
    if(seconds===last) return;
    last=seconds;
    draw(seconds,20);
    if(seconds>0) tick();
    else { clearInterval(timer); play.textContent='Запустить пример на 20 секунд'; }
  },100);
};
draw(1200,1200);
</script></html>
